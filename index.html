<style>
:root{--ink:#f1f0ec;--muted:#939393;--faint:#666;--edge:rgba(244,244,244,.22);--ground:#101011;--panel:#181819;--accent:#f1f0ec;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}html{scroll-behavior:auto}body{overflow:hidden;background:var(--ground);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .9s var(--ease),color .8s var(--ease)}
body[data-tone="paper"]{--ink:#202021;--muted:#6a6a6a;--faint:#888;--edge:rgba(26,26,26,.22);--ground:#eae9e5;--panel:#f3f2ee;--accent:#262626;color-scheme:light}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--ink);outline-offset:5px}button:disabled{opacity:.2;cursor:not-allowed}a{color:inherit}
.noise{pointer-events:none;z-index:30;position:fixed;inset:-35%;opacity:.115;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");background-size:170px 170px;mix-blend-mode:multiply}

.light-beam{position:fixed;inset:0;pointer-events:none;background:radial-gradient(44vw 40vw at var(--light-x,78%) var(--light-y,40%),rgba(255,255,255,.042),transparent 70%);z-index:0;transition:opacity .4s}body[data-tone="paper"] .light-beam{background:radial-gradient(45vw 40vw at var(--light-x,78%) var(--light-y,40%),rgba(0,0,0,.025),transparent 75%)}
.shell{position:relative;width:100%;height:100dvh;min-height:0;isolation:isolate;overflow:hidden}.shell::before{content:"";position:absolute;z-index:0;inset:75px 0 104px;pointer-events:none;background:linear-gradient(90deg,transparent 5%,var(--edge) 5%,var(--edge) calc(5% + 1px),transparent calc(5% + 1px),transparent 95%,var(--edge) 95%,var(--edge) calc(95% + 1px),transparent calc(95% + 1px));opacity:.18}
.topbar{position:absolute;z-index:15;top:0;left:0;right:0;height:79px;display:flex;align-items:center;gap:30px;padding:0 clamp(22px,5vw,78px);border-bottom:1px solid var(--edge)}.mark{width:38px;height:38px;border:1px solid var(--edge);display:grid;place-items:center;transform:rotate(-7deg);transition:transform .5s}.mark:hover{transform:rotate(12deg)}.mark svg{width:22px;stroke:var(--ink)}.top-divider{width:1px;height:24px;background:var(--edge)}.top-meta{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;opacity:.8}.top-spacer{flex:1}.top-button{background:none;border:0;padding:12px 0;text-transform:uppercase;letter-spacing:.14em;font:11px 'Space Mono',monospace;display:flex;gap:10px;align-items:center}.top-button .dot{width:6px;height:6px;background:var(--ink);border-radius:50%;opacity:.55}.top-button:hover{opacity:.58}.top-button::after{content:"↗";font-size:15px;margin-left:4px}
.progress-track{position:absolute;z-index:16;top:78px;left:0;right:0;height:2px;background:transparent}.progress-fill{height:100%;width:0%;background:var(--ink);transition:width .85s var(--ease)}
.side-index{position:absolute;z-index:5;left:clamp(14px,2.3vw,42px);top:47%;transform:translate(-50%,-50%) rotate(-90deg);font:10px 'Space Mono',monospace;letter-spacing:.28em;color:var(--muted);white-space:nowrap}
.main{position:absolute;z-index:2;inset:80px 0 105px;display:flex;align-items:center;justify-content:center;padding:25px clamp(28px,8.2vw,146px)}
.story-layout{width:100%;max-width:1350px;min-height:0;height:100%;display:grid;grid-template-columns:minmax(0,1.23fr) minmax(285px,.9fr);column-gap:clamp(20px,5.3vw,108px);align-items:center}
.story-column{height:100%;min-width:0;display:flex;flex-direction:column;justify-content:center;position:relative;padding:16px 0}.scene-header{display:flex;align-items:center;gap:16px;margin-bottom:clamp(21px,4vh,39px);flex-shrink:0}.scene-header .rule{width:30px;height:1px;background:var(--ink)}.chapter-number{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.21em;text-transform:uppercase}.scene-header .context{margin-left:auto;font:10px 'Space Mono',monospace;letter-spacing:.12em;color:var(--muted)}
.copy-window{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--edge) transparent;max-height:min(64vh,690px);padding-right:15px;min-height:0}.story-text{margin:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;letter-spacing:-.024em;line-height:1.48;font-size:clamp(19px,1.65vw,25px);font-weight:400}.story-text .lead{display:block;font-size:clamp(25px,2.4vw,37px);line-height:1.32;font-weight:600;letter-spacing:-.045em;margin-bottom:.65em}.story-text .rest{color:var(--ink);opacity:.84}.story-text:not(.split) .lead{font-size:clamp(23px,2.2vw,35px)}
.story-footnote{flex-shrink:0;display:flex;align-items:center;gap:12px;margin-top:clamp(16px,4vh,44px);color:var(--muted);font:10px 'Space Mono',monospace;letter-spacing:.11em;text-transform:uppercase}.story-footnote span:last-child{width:44px;height:1px;background:var(--muted);opacity:.6}
.visual-column{position:relative;min-width:0;height:min(63vh,640px);width:100%;display:flex;align-items:center;justify-content:center;perspective:700px}.visual-column::before{content:"";position:absolute;inset:1% 6%;border:1px solid var(--edge);opacity:.28;transform:rotate(-4deg);transition:transform 1s var(--ease)}.visual-column:hover::before{transform:rotate(1deg)}.visual-column::after{content:"";position:absolute;left:-19px;top:25px;width:38px;height:38px;border-top:1px solid var(--edge);border-left:1px solid var(--edge);opacity:.7}
.artboard{position:relative;display:flex;align-items:center;justify-content:center;width:90%;height:89%;border:1px solid var(--edge);background:linear-gradient(145deg,rgba(255,255,255,.045),transparent 50%,rgba(255,255,255,.015));overflow:hidden;transform:rotate(.75deg);transition:transform 1.1s var(--ease);cursor:pointer}body[data-tone="paper"] .artboard{background:linear-gradient(150deg,rgba(255,255,255,.55),rgba(0,0,0,.016))}.artboard:hover{transform:rotate(0) translateY(-4px)}.artboard::before,.artboard::after{position:absolute;font:10px 'Space Mono',monospace;color:var(--muted);letter-spacing:.13em;z-index:2}.artboard::before{content:"FIG. " attr(data-num);left:22px;top:19px}.artboard::after{content:"✳";right:22px;bottom:19px;font-size:23px;font-family:serif}.artboard .crosshair{position:absolute;z-index:2;inset:11%;border-left:1px dashed var(--edge);border-right:1px dashed var(--edge);opacity:.3;pointer-events:none}.artboard .art-bg-ring{position:absolute;width:75%;aspect-ratio:1;border:1px solid var(--edge);border-radius:50%;opacity:.5}.art-svg{position:relative;z-index:1;display:block;width:100%;height:100%;max-width:560px;max-height:560px;overflow:visible;filter:drop-shadow(0 12px 24px rgba(0,0,0,.13));transform:translate3d(calc(var(--move-x,0)*1px),calc(var(--move-y,0)*1px),0);transition:transform .45s ease-out}.art-svg *{vector-effect:non-scaling-stroke}.art-draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:sketch-in 2.5s cubic-bezier(.3,.65,.1,1) forwards}.slow-spin{transform-origin:50% 50%;animation:spin 35s linear infinite}.float{animation:float 8s ease-in-out infinite}
@keyframes sketch-in{to{stroke-dashoffset:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-13px)}}
.art-caption{position:absolute;bottom:-21px;right:0;font:9px 'Space Mono',monospace;letter-spacing:.17em;color:var(--muted);text-transform:uppercase}
.bottom{position:absolute;z-index:12;bottom:0;left:0;right:0;height:105px;border-top:1px solid var(--edge);padding:0 clamp(22px,5vw,78px);display:flex;align-items:center;gap:23px}.pagecount{display:flex;align-items:baseline;gap:8px;font:12px 'Space Mono',monospace;white-space:nowrap}.pagecount .current{font-size:28px;letter-spacing:-.07em}.pagecount .slash,.pagecount .total{color:var(--muted)}.mini-rail{height:1px;background:var(--edge);width:min(19vw,220px);position:relative}.mini-rail-fill{position:absolute;top:0;bottom:0;left:0;background:var(--ink);width:0;transition:width .7s var(--ease)}.bottom-hint{margin-left:8px;font:10px 'Space Mono',monospace;color:var(--muted);letter-spacing:.08em;white-space:nowrap}.nav{display:flex;gap:10px;margin-left:auto;align-items:center}.nav button{border:1px solid var(--edge);background:transparent;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s,transform .4s var(--ease)}.nav button:hover:not(:disabled){background:var(--ink);color:var(--ground);transform:scale(1.06)}.nav button svg{width:20px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.nav button#next{background:var(--ink);color:var(--ground);border-color:var(--ink)}.nav button#next:hover:not(:disabled){transform:translateX(5px)}.nav button#next:disabled{background:transparent;color:var(--muted);border-color:var(--edge)}
.scene-fade-out .story-column{animation:out-left .21s ease forwards}.scene-fade-out .visual-column{animation:out-right .25s ease forwards}.scene-fade-in .story-column{animation:in-left .72s var(--ease) both}.scene-fade-in .visual-column{animation:in-right .9s var(--ease) both}@keyframes out-left{to{opacity:0;transform:translateX(-16px);filter:blur(3px)}}@keyframes out-right{to{opacity:0;transform:translateX(14px) rotate(2deg);filter:blur(4px)}}@keyframes in-left{from{opacity:0;transform:translateX(37px);filter:blur(7px)}to{opacity:1;transform:translateX(0);filter:blur(0)}}@keyframes in-right{from{opacity:0;transform:translateX(-37px) rotate(-2deg);filter:blur(8px)}to{opacity:1;transform:translateX(0) rotate(0);filter:blur(0)}}
/* Full-text and chapter navigation */
.overlay{position:fixed;z-index:40;inset:0;display:none;place-items:center;padding:25px;background:rgba(4,4,4,.86);backdrop-filter:blur(16px)}.overlay.open{display:grid}.overlay-panel{position:relative;background:#ebeae7;color:#202020;border:1px solid #d1d0cb;width:min(920px,100%);max-height:min(90dvh,880px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 35px 140px rgba(0,0,0,.4)}.overlay-top{display:flex;align-items:center;padding:24px clamp(22px,3vw,44px);gap:16px;border-bottom:1px solid #c8c7c2}.overlay-label{font:11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.16em}.overlay-x{margin-left:auto;width:38px;height:38px;border:1px solid #aaa;background:none;font-size:21px;line-height:1}.overlay-body{overflow:auto;overscroll-behavior:contain;padding:clamp(22px,4.5vw,62px);scrollbar-width:thin}.fulltext{margin:0;white-space:pre-wrap;overflow-wrap:break-word;font-size:clamp(17px,2.15vw,23px);letter-spacing:-.02em;line-height:1.8}.overlay-actions{padding:18px clamp(22px,3vw,44px);border-top:1px solid #c8c7c2;display:flex;justify-content:space-between;align-items:center;font:10px 'Space Mono',monospace;gap:12px}.copy-button{padding:13px 20px;border:1px solid #222;background:#222;color:#fff;letter-spacing:.05em}.copy-button:hover{background:#fff;color:#222}.chapter-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#c2c1bb;border:1px solid #c2c1bb}.chapter-tile{min-width:0;min-height:130px;text-align:left;border:0;background:#ebeae7;color:#202020;display:flex;flex-direction:column;padding:17px;gap:17px;transition:background .25s}.chapter-tile:hover,.chapter-tile.active{background:#d1d0cb}.chapter-tile .num{font:14px 'Space Mono',monospace}.chapter-tile .preview{font:14px/1.45 'DM Sans',sans-serif;color:#555;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
@media(max-width:1000px){.main{padding:20px 7vw}.story-layout{grid-template-columns:minmax(0,1.35fr) minmax(230px,.8fr);gap:20px}.story-text{font-size:clamp(18px,2.1vw,23px)}.story-text .lead{font-size:clamp(24px,2.65vw,33px)}.bottom-hint{display:none}}
@media(max-width:720px){.shell::before,.side-index{display:none}.topbar{height:65px;padding:0 21px;gap:14px}.topbar .top-meta{display:none}.top-divider{height:18px}.top-button{font-size:9px;letter-spacing:.07em}.mark{width:32px;height:32px}.progress-track{top:64px}.main{inset:65px 0 89px;padding:0 22px}.story-layout{display:block;position:relative;height:100%}.story-column{z-index:3;height:100%;width:100%;padding:20px 0;justify-content:center}.scene-header{margin-bottom:clamp(13px,3vh,25px)}.scene-header .context{display:none}.scene-header .rule{width:20px}.copy-window{max-height:min(67dvh,660px);padding-right:4px}.story-text{font-size:clamp(17.5px,4.4vw,21px);line-height:1.53;letter-spacing:-.02em;text-shadow:0 0 45px var(--ground)}.story-text .lead{font-size:clamp(23px,5.8vw,31px);line-height:1.34;letter-spacing:-.035em;margin-bottom:.75em}.story-footnote{margin-top:18px;font-size:9px}.visual-column{position:absolute;z-index:0;right:-48%;top:4%;width:105%;height:90%;opacity:.13;pointer-events:none}.artboard{border:0}.visual-column::before,.visual-column::after,.art-caption,.artboard::before,.artboard::after,.artboard .crosshair{display:none}.bottom{height:89px;padding:0 21px}.pagecount .current{font-size:24px}.mini-rail{width:80px}.nav button{width:49px;height:49px}.chapter-list{grid-template-columns:repeat(2,minmax(0,1fr))}.chapter-tile{min-height:120px}}
@media(max-height:640px){.shell .main{inset:64px 0 75px}.topbar{height:64px}.progress-track{top:63px}.bottom{height:75px}.story-column{padding:7px 0}.scene-header{margin-bottom:10px}.story-footnote{margin-top:9px}.copy-window{max-height:calc(100dvh - 210px)}.story-text{font-size:clamp(16px,1.65vw,22px);line-height:1.37}.story-text .lead{font-size:clamp(19px,2.3vw,30px);margin-bottom:.4em}.nav button{width:43px;height:43px}.visual-column{height:100%}}
@media(max-width:720px) and (max-height:640px){.main{padding:0 28px}.story-column{max-width:92%;padding:5px 0}.visual-column{right:-40%;width:80%}.scene-header{margin-bottom:8px}.copy-window{max-height:calc(100dvh - 190px)}.story-text{font-size:16px}.story-text .lead{font-size:20px}.story-footnote{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>

unu biliyosun zatende yiende soyluyorum :P. sanat oznel derler nesnel degildir derler ama bence hayir benze nesnel oznel olan begenip beyenmemeleri ama resmin guzel ve iyi oldugu bence bunalr nesnel seyler resimelrini su anda kimse gosterirrisem gostereyim beyenmeselerde iyi olduklairni itiraf ederler ortalamanin baya ustunde oldugnu soylerler. buda her ne kadar mantiksiz gorunsede istersen gel deneyelim :P\ncizimlerini cok beyeniyorum kendilerine her nedense bir tarzi var gibi hissediyorum senin gozunde kotuler neden cunku referans foto ile aralarind farklari var ama benim gozumde ise bu bir tarz cunku referans fotodan baska birisi cizdi ve oda kendi tarzini kullandi.\ncizimlerin her zaman iyilesmek ve gelismek zorunda degil hatta benden soylemesi bunalri ikinci pilana al sanirim oyel yapiyosun ama bilmiyorum seni bazen etkielrdiklerini hissediyorum. cizimde bir kastir bu kas her zaman tam enerjisinde olamayabilri tam formatinda olmaya bilir bu yuzden dususler gormeni ben baya normal goruyorum hatta cizimin gelismesi icin bu kotulukler lazim cunku kotu yanlarini fakr etmeye baslarsin ve nelere odaklanman gerektingini fakr edersin ve tekrar gelismeye baslarsin. he seni bu cok uzuyosa dusus olunca yeni ciizm tarzi dene bence bilmiyorum bedne oyle yapiyodum bu ara 3d cizimini ogrenmeyi calsiyodum olmayinc agidiyodum yani bir sey deniyodum taki kendi styleimi bulana kadar oda cartoon cizimleri onalri cok iyi cizerim :P aha konu yine bana geldi of neyse eee birde resimlerini sikca atirini fark ettim hani cizimin olmadiysa liyon atiyon direkt buda beni baya rahatsiz ediyo cunku soyle sinava girdin ilk sinavdan 90 aldin ikinci sinavdan 60 aldin uzuldun ve sonraki 6 sinavin hepsinde 60 aldin sonra sekizinci sianva geldi ve o sinavdan bir anda 85 aldin otomatikmen mutlu olursun cunku cok dusuk seylerden sonra yuksek bir sey geldi ilk sanav kadar iyimisin hayir degilsin ama artma var cizimlerindede oyle gelisme oldgunu gormuyorum goruyorum ama fazla degil diyosun nedeni ne sence ? cunku sende kotu cizim yok ya atiyosun veya yarida birakiyosun bu yuzden gercektne gelismeyi goremiyosun sadece efsanevi iki resmi karsilastiriyosun aralarindaki fark kucuk olmasi zaten normal. he bide senin cizimlerimi kullanarak bi gun oyun veya uygulama yapcam ne zamn bilmiyorum ama yapcaz kendini hazirla zuahhahahahhaah";

function splitLead(s,index){
 // Visual typography only; concatenation reproduces every character exactly.
 const limit=index===0?105:120;
 let end=s.lastIndexOf(' ',Math.min(s.length-1,limit));
 if(end<45)end=Math.min(limit,s.length);
 return [s.slice(0,end),s.slice(end)];
}
function createTile(i){
 const b=document.createElement('button');b.type='button';b.className='chapter-tile'+(i===current?' active':'');
 const num=document.createElement('span');num.className='num';num.textContent=pad(i+1)+' / '+pad(count);
 const preview=document.createElement('span');preview.className='preview';preview.textContent=scenes[i].trim().slice(0,110)+'…';
 b.append(num,preview);b.addEventListener('click',()=>{closeOverlay('chaptersOverlay');change(i)});return b;
}
function update(){
 const s=scenes[current];
 document.body.dataset.tone=tones[current]||'ink';
 $('chapterNumber').textContent=`${pad(current+1)} / ${pad(count)}`;
 $('sceneFooter').textContent=`${pad(current+1)} — ${pad(count)}`;
 $('currentCount').textContent=pad(current+1);
 const pct=(current+1)/count*100;
 $('progress').style.width=`${pct}%`;
 $('miniProgress').style.width=`${pct}%`;
 $('previous').disabled=current===0;
 $('next').disabled=current===count-1;
 $('next').setAttribute('aria-label',current===count-1?'Son bölüm':'Sonraki bölüm');
 const [first,rest]=splitLead(s,current);
 const p=$('storyText');p.replaceChildren();p.classList.toggle('split',!!rest);
 const a=document.createElement('span');a.className='lead';a.textContent=first;
 const b=document.createElement('span');b.className='rest';b.textContent=rest;
 p.append(a,b);
 $('copyWindow').scrollTop=0;
 $('artboard').dataset.num=pad(current+1);
 $('motif').innerHTML=motif(current);
 $('artboard').style.setProperty('--move-x',0);
 $('artboard').style.setProperty('--move-y',0);
 $('chapterList').replaceChildren(...scenes.map((_,i)=>createTile(i)));
 history.replaceState(null,'','#'+pad(current+1));
}
let swapTimer;
function change(i){
 if(i<0||i>=count||i===current||busy)return;
 busy=true;
 const stage=$('storyLayout');
 if(reduced){current=i;update();busy=false;return}
 stage.classList.remove('scene-fade-in');stage.classList.add('scene-fade-out');
 clearTimeout(swapTimer);
 swapTimer=setTimeout(()=>{
  current=i;update();stage.classList.remove('scene-fade-out');stage.classList.add('scene-fade-in');
  swapTimer=setTimeout(()=>{stage.classList.remove('scene-fade-in');busy=false},700);
 },220);
}
$('previous').addEventListener('click',()=>change(current-1));
$('next').addEventListener('click',()=>change(current+1));
$('artboard').addEventListener('click',()=>change(current+1));
$('artboard').addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'||reduced)return;
 const r=e.currentTarget.getBoundingClientRect();
 e.currentTarget.style.setProperty('--move-x',((e.clientX-r.left)/r.width-.5)*19);
 e.currentTarget.style.setProperty('--move-y',((e.clientY-r.top)/r.height-.5)*19);
});
$('artboard').addEventListener('pointerleave',e=>{e.currentTarget.style.setProperty('--move-x',0);e.currentTarget.style.setProperty('--move-y',0)});
window.addEventListener('pointermove',e=>{
 if(reduced)return;
 document.body.style.setProperty('--light-x',e.clientX/window.innerWidth*100+'%');
 document.body.style.setProperty('--light-y',e.clientY/window.innerHeight*100+'%');
},{passive:true});
function openOverlay(id){$(id).classList.add('open');document.body.style.overflow='hidden';$(id).querySelector('.overlay-x').focus()}
function closeOverlay(id){$(id).classList.remove('open');$(id==='fullOverlay'?'fullBtn':'chaptersBtn').focus()}
$('fullBtn').addEventListener('click',()=>openOverlay('fullOverlay'));
$('chaptersBtn').addEventListener('click',()=>openOverlay('chaptersOverlay'));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeOverlay(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeOverlay(o.id)}));
$('copyAll').addEventListener('click',async()=>{
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(originalText)}
  else{const t=document.createElement('textarea');t.value=originalText;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}
  $('copyAll').textContent='KOPYALANDI ✓';setTimeout(()=>$('copyAll').textContent='METNİ KOPYALA ↗',1600);
 }catch(e){$('copyAll').textContent='KOPYALANAMADI';setTimeout(()=>$('copyAll').textContent='METNİ KOPYALA ↗',1800)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  for(const el of document.querySelectorAll('.overlay.open'))closeOverlay(el.id);
  return;
 }
 if(document.querySelector('.overlay.open'))return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();change(current+1)}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();change(current-1)}
 if(e.key==='Home'){e.preventDefault();change(0)}
 if(e.key==='End'){e.preventDefault();change(count-1)}
});
let wheelAccum=0;
window.addEventListener('wheel',e=>{
 if(document.querySelector('.overlay.open'))return;
 if(Math.abs(e.deltaY)<4)return;
 const textArea=$('copyWindow');
 const atTop=textArea.scrollTop<2;
 const atBottom=textArea.scrollTop+textArea.clientHeight>=textArea.scrollHeight-3;
 // Let the reading area scroll fully before moving to another scene.
 if(e.deltaY>0&&!atBottom)return;
 if(e.deltaY<0&&!atTop)return;
 const now=Date.now();if(now-lastWheel<750)return;
 wheelAccum+=e.deltaY;
 if(Math.abs(wheelAccum)>65){lastWheel=now;change(current+(wheelAccum>0?1:-1));wheelAccum=0}
},{passive:true});
window.addEventListener('touchstart',e=>{
 if(document.querySelector('.overlay.open')||e.touches.length!==1)return;
 gesture={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
window.addEventListener('touchend',e=>{
 if(!gesture||document.querySelector('.overlay.open')){gesture=null;return}
 const dx=e.changedTouches[0].clientX-gesture.x,dy=e.changedTouches[0].clientY-gesture.y;gesture=null;
 if(Math.abs(dx)>72&&Math.abs(dx)>Math.abs(dy)*1.4)change(current+(dx<0?1:-1));
},{passive:true});
window.addEventListener('hashchange',()=>{
 const idx=parseInt(location.hash.slice(1),10)-1;
 if(Number.isInteger(idx)&&idx>=0&&idx<count)change(idx);
});
const start=parseInt(location.hash.slice(1),10)-1;
if(Number.isInteger(start)&&start>=0&&start<count)current=start;
update();
</script>
</body>
</html>
